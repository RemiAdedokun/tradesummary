<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cede FX Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #0052ff;
        --primary-hover: #0045db;
        --bg: #f8fafc;
        --card: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --success: #10b981;
        --whatsapp: #25d366;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        line-height: 1.5;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 40px auto;
        background: var(--card);
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05),
          0 8px 10px -6px rgba(0, 0, 0, 0.05);
      }

      h2 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
      }

      .tabs {
        display: flex;
        background: #f1f5f9;
        padding: 4px;
        border-radius: 12px;
        margin-bottom: 24px;
      }

      .tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.2s ease;
        color: var(--text-muted);
      }

      .tab.active {
        background: var(--card);
        color: var(--primary);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .input-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      @media (max-width: 480px) {
        .input-group {
          grid-template-columns: 1fr;
        }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      input,
      select {
        padding: 12px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
        color: var(--text-main);
        transition: border-color 0.2s;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--primary);
      }
      input[readonly] {
        background-color: #f8fafc;
        cursor: not-allowed;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 32px 0 16px;
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
      }

      #toggleAccountBtn {
        font-size: 12px;
        color: var(--primary);
        background: none;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      .summary-card {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-top: 10px;
      }
      .summary-content {
        white-space: pre-line;
        font-size: 13px;
        font-family: "Courier New", Courier, monospace;
        color: #334155;
        line-height: 1.6;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 24px;
      }

      .btn {
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: white;
      }

      .btn-primary {
        background: var(--primary);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .btn-whatsapp {
        background: var(--whatsapp);
      }

      .btn-whatsapp:hover {
        background: #1eb956;
        transform: translateY(-1px);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>FX Trade Summary</h2>

      <div class="tabs">
        <div class="tab active" data-type="SELL">SELL USD</div>
        <div class="tab" data-type="BUY">BUY USD</div>
      </div>

      <div class="input-group">
        <div class="field">
          <label>Amount (USD)</label>
          <input type="text" id="fcy" value="900,000" placeholder="0.00" />
        </div>
        <div class="field">
          <label>Rate (NGN)</label>
          <input type="text" id="rate" value="1,477" placeholder="0.00" />
        </div>
        <div class="field">
          <label>USD Settlement</label>
          <select id="usdSettle">
            <option value="TOD">TOD (Value Today)</option>
            <option value="TOM">TOM (Value Tomorrow)</option>
            <option value="T2">T+2 (Spot)</option>
          </select>
        </div>
        <div class="field">
          <label>USD Value Date</label>
          <input type="date" id="settleDate" />
        </div>
      </div>

      <div class="section-header">
        <h3 id="accountTitle">Account Details</h3>
        <button id="toggleAccountBtn">Show Details</button>
      </div>

      <div class="field" style="margin-bottom: 20px">
        <label>Select Profile</label>
        <select id="accountSelect"></select>
      </div>

      <div id="accountFields" class="input-group hidden"></div>

      <h3 style="margin-top: 24px">Trade Confirmation</h3>
      <div class="summary-card">
        <div id="summary" class="summary-content"></div>
      </div>

      <div class="button-row">
        <button class="btn btn-primary" onclick="copySummary()">
          <span>Copy Text</span>
        </button>
        <button class="btn btn-whatsapp" onclick="shareWhatsApp()">
          <span>Share WhatsApp</span>
        </button>
      </div>
    </div>

    <script>
      let tradeType = "SELL";

      const fcyInput = document.getElementById("fcy");
      const rateInput = document.getElementById("rate");
      const usdSettle = document.getElementById("usdSettle");
      const settleDate = document.getElementById("settleDate");
      const accountSelect = document.getElementById("accountSelect");
      const accountFields = document.getElementById("accountFields");
      const accountTitle = document.getElementById("accountTitle");
      const summary = document.getElementById("summary");
      const toggleAccountBtn = document.getElementById("toggleAccountBtn");

      const accounts = {
        SELL: {
          title: "NGN Receiving Account",
          list: {
            CEDE_ZENITH: {
              Name: "Cede Technologies Limited",
              Account: "1313149930",
              Bank: "Zenith Bank",
            },
            CEDE_PROVIDUS: {
              Name: "Cede Technologies Limited",
              Account: "9616773885",
              Bank: "Providus Bank",
            },
            CEDE_ACCESS: {
              Name: "Cede Technologies Ltd",
              Account: "1861498757",
              Bank: "Access Bank",
            },
          },
        },
        BUY: {
          title: "USD Settlement Account",
          list: {
            CEDE_IFX: {
              Beneficiary: "Cede Technologies Inc",
              Bank: "IFX Payments",
              Account: "67146817",
              "Sort Code": "23-22-90",
              IBAN: "GB77IFXS23229067146817",
              SWIFT: "IFXSGB2L",
              Address: "London, W1G 0PW, UK",
            },
            CEDE_FIDELITY: {
              Name: "Cede Technologies Ltd",
              Account: "5240070157",
              Bank: "Fidelity Bank",
              Currency: "USD",
            },
          },
        },
      };

      const cleanNum = (str) => parseFloat(str.replace(/,/g, "")) || 0;

      function formatCurrency(num, decimals = 2) {
        return num.toLocaleString("en-US", {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals,
        });
      }

      function handleInputFormatting(e) {
        let value = e.target.value.replace(/,/g, "");
        if (!isNaN(value) && value !== "") {
          e.target.value = parseFloat(value).toLocaleString("en-US");
        }
        updateSummary();
      }

      function setDates() {
        const usdDate = new Date();
        if (usdSettle.value === "TOM") usdDate.setDate(usdDate.getDate() + 1);
        if (usdSettle.value === "T2") usdDate.setDate(usdDate.getDate() + 2);
        settleDate.value = usdDate.toISOString().split("T")[0];
        updateSummary();
      }

      function loadAccounts() {
        const config = accounts[tradeType];
        accountTitle.textContent = config.title;
        accountSelect.innerHTML = "";
        Object.keys(config.list).forEach((key) => {
          const opt = document.createElement("option");
          opt.value = key;
          opt.textContent = key.replace(/_/g, " ");
          accountSelect.appendChild(opt);
        });
        renderAccountFields();
      }

      function renderAccountFields() {
        accountFields.innerHTML = "";
        const selected = accounts[tradeType].list[accountSelect.value];
        if (!selected) return;
        Object.entries(selected).forEach(([label, value]) => {
          const div = document.createElement("div");
          div.className = "field";
          div.innerHTML = `<label>${label}</label><input type="text" value="${value}" readonly />`;
          accountFields.appendChild(div);
        });
        updateSummary();
      }

      function updateSummary() {
        const fcyVal = cleanNum(fcyInput.value);
        const rateVal = cleanNum(rateInput.value);
        const lcy = fcyVal * rateVal;
        const isBuy = tradeType === "BUY";

        const ngnDate = new Date().toDateString();
        const usdDate = new Date(settleDate.value).toDateString();

        const selected = accounts[tradeType].list[accountSelect.value];
        const accountText = selected
          ? Object.entries(selected)
              .map(([k, v]) => `*${k}:* ${v}`)
              .join("\n")
          : "";

        summary.textContent = `⚡ *TRADE CONFIRMATION*
---------------------------
*${accounts[tradeType].title}*
${accountText}

📊 *Settlement Details*
${isBuy ? "Bought" : "Sold"} USD: *$${formatCurrency(fcyVal)}*
Rate: *${formatCurrency(rateVal, 2)}*
${isBuy ? "Sold" : "Bought"} NGN: *₦${formatCurrency(lcy)}*

📅 *Value Dates*
NGN Value Date: ${ngnDate}
USD Value Date: ${usdDate}`;
      }

      function copySummary() {
        navigator.clipboard.writeText(summary.textContent).then(() => {
          const btn = document.querySelector(".btn-primary");
          const originalText = btn.innerHTML;
          btn.innerHTML = "<span>✓ Copied</span>";
          btn.style.background = "#10B981";
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = "#0052FF";
          }, 2000);
        });
      }

      function shareWhatsApp() {
        const text = encodeURIComponent(summary.textContent);
        window.open(`https://wa.me/?text=${text}`, "_blank");
      }

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          tradeType = tab.dataset.type;
          loadAccounts();
          setDates();
        });
      });

      toggleAccountBtn.addEventListener("click", () => {
        const isHidden = accountFields.classList.toggle("hidden");
        toggleAccountBtn.textContent = isHidden
          ? "Show Details"
          : "Hide Details";
      });

      accountSelect.addEventListener("change", renderAccountFields);
      usdSettle.addEventListener("change", setDates);
      [fcyInput, rateInput].forEach((el) =>
        el.addEventListener("input", handleInputFormatting)
      );
      settleDate.addEventListener("input", updateSummary);

      setDates();
      loadAccounts();
    </script>
  </body>
</html>
